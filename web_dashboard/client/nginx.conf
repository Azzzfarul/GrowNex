server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    # nginx's default is 1 MB; identify-plant takes photos up to 4 MB (express.raw limit in routes/ai.js)
    client_max_body_size 5m;
    # Variable + Docker DNS: re-resolve "server" so a recreated container (new IP) is still reached.
    resolver 127.0.0.11 valid=10s;
    set $api http://server:5000;
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    try_files $uri /index.html;
  }
}
