; GrowNex camera node — AI-Thinker ESP32-CAM, flashed over USB through the ESP32-CAM-MB board.
; Separate project from ../firmware (the sensor/relay node).
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
; The ESP32-CAM-MB wires DTR/RTS to RST/IO0 — if the monitor asserts them the chip is held in
; reset / download mode and the console shows garbage. Upload still auto-resets without these.
monitor_rts = 0
monitor_dtr = 0
monitor_filters = esp32_exception_decoder
board_build.partitions = huge_app.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
lib_deps =
    knolleary/PubSubClient @ ^2.8
 